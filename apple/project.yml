name: Casm
options:
  bundleIdPrefix: me.raczka.casm
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ANJFD2CA3W
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: casm
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CasmKit:
    path: CasmKit
targets:
  CasmMac:
    type: application
    platform: macOS
    sources: [App/Shared, App/macOS]
    info:
      path: App/macOS/Info.plist
      properties:
        # Plain ws:// to hosts on the LAN or a tailnet; networking is the user's business.
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}
    dependencies:
      - package: CasmKit
    settings:
      base:
        PRODUCT_NAME: casm
        PRODUCT_BUNDLE_IDENTIFIER: me.raczka.casm.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Free "Apple Development" identity; no capabilities, so no provisioning profile needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
  CasmiOS:
    type: application
    platform: iOS
    sources: [App/Shared, App/iOS]
    info:
      path: App/iOS/Info.plist
      properties:
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}
    dependencies:
      - package: CasmKit
    settings:
      base:
        PRODUCT_NAME: casm
        PRODUCT_BUNDLE_IDENTIFIER: me.raczka.casm.ios
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: casm connects to agent servers on your local network.
schemes:
  CasmMac:
    build:
      targets: {CasmMac: all}
    run:
      config: Debug
  CasmiOS:
    build:
      targets: {CasmiOS: all}

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
    <!-- Wide windows (the Dock/desktop app) tint the title bar like the sidebar
         under it; narrow ones (phones) like the chat header. First match wins. -->
    <meta
      name="theme-color"
      content="#faf0e5"
      media="(prefers-color-scheme: light) and (min-width: 651px)"
    />
    <meta
      name="theme-color"
      content="#081016"
      media="(prefers-color-scheme: dark) and (min-width: 651px)"
    />
    <meta
      name="theme-color"
      content="#fffaf4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b141a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="A focused workspace for your coding agents"
    />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="casm" />
    <!-- "default", not "black-translucent": with the translucent bar, iOS 18 Home
         Screen apps start the page under the status bar but size it a status bar
         short, leaving a band at the bottom. With "default" the page starts below
         the status bar and reaches the bottom; the bar takes the theme color. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <title>casm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
